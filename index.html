<h1>Novasurf（ノヴァサーフ）</h1>
<p>押している間だけ、近くの星につかまって回る。離すと、その向きに飛び出す。後ろから迫る波に乗って、何光年まで飛べるか。今日の星の並びは、世界で全員おなじです。</p>
